<div class="dialog-bg">
    <div class="toolbar">
        <div class="toolbar-title">建立target</div>
    </div>
    <div class="container" [formGroup]="targetForm">
        <div class="list-content">
            <div class="input-form-container">
                <div class="input-form-container">
                    <label for="name" class="form-label-two">
                        <span>名</span>
                        <span>稱</span>
                    </label>
                    <input type="text" formControlName="name" id="name">
                </div>
            </div>
        </div>
    </div>
    <div class="bottom">
        <button class="cancel-btn" (click)="close()">
            <span>取</span>
            <span>消</span>
        </button>
        <button class="save-btn" (click)="save()" [disabled]="targetForm.invalid">
            <span>儲</span>
            <span>存</span>
        </button>
    </div>
</div>
