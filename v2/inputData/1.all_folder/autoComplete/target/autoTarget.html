<ng-container *ngIf="!">
    <input type="text" matInput formControlName="targetId" [matAutocomplete]="targetAuto">
    <mat-autocomplete #targetAuto="matAutocomplete" [displayWith]="displayWithTarget">
        <mat-option *ngFor="let target of filteredTargetList | async" [value]="target.id">
            {{ target?.name }}
        </mat-option>
    </mat-autocomplete>
</ng-container>
